<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Nueva contraseña</title>

<!-- BOOTSTRAP -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<!-- ICONOS -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<!-- CSS -->
<link rel="stylesheet" href="app.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#2563eb">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

</head>

<body class="pantalla-auth">

<!-- ALERTA ERROR -->
<div id="alerta-error"
class="alert alert-danger d-none p-2 small text-center mx-3 mt-3"
role="alert">

    <i class="bi bi-exclamation-circle"></i>

    <span id="mensaje-error-texto"></span>

</div>

<div class="tarjeta-blanca fade">

    <div class="text-center mb-3">

        <i class="bi bi-shield-lock fs-1"></i>

        <h1>Restablecer contraseña</h1>

        <p>
            Ingresa tu nueva contraseña
        </p>

    </div>

    <!-- FORM -->
    <form id="form-reset-password">

        <!-- NUEVA PASSWORD -->
        <div class="campo">

            <label>Nueva contraseña</label>

            <input
            type="password"
            id="new-password"
            placeholder="********"
            required>

        </div>

        <!-- CONFIRMAR PASSWORD -->
        <div class="campo">

            <label>Confirmar contraseña</label>

            <input
            type="password"
            id="confirm-password"
            placeholder="********"
            required>

        </div>

        <!-- BOTÓN -->
        <button
        type="submit"
        class="boton-primario">

            <i class="bi bi-check-circle"></i>

            Actualizar contraseña

        </button>

    </form>

    <!-- VOLVER -->
    <p class="text-center mt-3">

        <a href="Login.html">

            <i class="bi bi-arrow-left"></i>

            Volver al inicio

        </a>

    </p>

</div>

<!-- MODAL STATUS -->
<div id="status-container" class="d-none">

    <div class="status-box">

        <div id="status-spinner"
        class="spinner-border text-primary"></div>

        <i id="status-check"
        class="bi bi-check-circle-fill text-success d-none fs-1"></i>

        <p id="status-texto"
        class="mt-2 mb-0 fw-bold">

            Procesando...

        </p>

    </div>

</div>

<footer class="footer-app">

© 2026 Todos los derechos reservados

</footer>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- AUTH -->
<script src="auth.js"></script>

</body>
</html>
